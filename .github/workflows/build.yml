name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Descargar Rubber Band
        run: |
          git clone --depth 1 --branch v4.0.0 https://github.com/breakfastquay/rubberband.git app/src/main/cpp/rubberband \
            || git clone --depth 1 https://github.com/breakfastquay/rubberband.git app/src/main/cpp/rubberband
          git -C app/src/main/cpp/rubberband log -1 --format="Rubber Band commit: %H"
          ls app/src/main/cpp/rubberband/single

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK y CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TonoKempo-debug
          path: app/build/outputs/apk/debug/*.apk
