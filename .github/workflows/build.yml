name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Descargar Rubber Band
        run: |
          git clone --depth 1 --branch v4.0.0 https://github.com/breakfastquay/rubberband.git app/src/main/cpp/rubberband \
            || git clone --depth 1 https://github.com/breakfastquay/rubberband.git app/src/main/cpp/rubberband
          git -C app/src/main/cpp/rubberband log -1 --format="Rubber Band commit: %H"
          ls app/src/main/cpp/rubberband/single

      - name: Usar el NDK que ya trae el runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" || true
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TonoKempo-debug
          path: app/build/outputs/apk/debug/*.apk
